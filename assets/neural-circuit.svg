  <circle cx="90" cy="350" r="4" fill="#0284c7"/>

  <path d="M250 330 H180 L140 370 H60 L30 400" stroke="#8b5cf6" stroke-width="1.75" stroke-linecap="round" opacity="0.7"/>
  <circle cx="140" cy="370" r="4" fill="#c084fc"/>

  <!-- Secondary Neural Synaptic Nodes & Bridges -->
  <circle cx="120" cy="140" r="14" fill="url(#circuitGlow2)"/>
  <circle cx="120" cy="140" r="5" fill="#818cf8"/>

  <circle cx="440" cy="110" r="14" fill="url(#circuitGlow1)"/>
  <circle cx="440" cy="110" r="5" fill="#38bdf8"/>

  <circle cx="480" cy="500" r="14" fill="url(#circuitGlow2)"/>
  <circle cx="480" cy="500" r="5" fill="#a78bfa"/>

  <circle cx="180" cy="470" r="14" fill="url(#brainNode)"/>
  <circle cx="180" cy="470" r="5" fill="#14b8a6"/>

  <!-- Geometric Logic Gates -->
  <polygon points="170,220 185,230 170,240" fill="#38bdf8" opacity="0.6"/>
  <polygon points="420,360 435,370 420,380" fill="#818cf8" opacity="0.6"/>
  <polygon points="340,490 350,505 330,505" fill="#2dd4bf" opacity="0.6"/>
  <polygon points="220,130 230,145 210,145" fill="#60a5fa" opacity="0.6"/>

  <!-- Hexagonal Synaptic Pods -->
  <polygon points="495,290 515,290 525,307 515,324 495,324 485,307" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="95,440 115,440 125,457 115,474 95,474 85,457" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="475,90 495,90 505,107 495,124 475,124 465,107" stroke="#14b8a6" stroke-width="1.5" fill="none" opacity="0.5"/>
