  <circle cx="510" cy="460" r="4" fill="#6366f1"/>

  <path d="M350 300 H460 L510 250 H590" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="460" cy="300" r="5" fill="#22d3ee"/>
  <circle cx="510" cy="250" r="4" fill="#0891b2"/>

  <path d="M350 330 H410 L450 370 H540 L570 400" stroke="#10b981" stroke-width="1.75" stroke-linecap="round" opacity="0.7"/>
  <circle cx="450" cy="370" r="4" fill="#34d399"/>
  <circle cx="540" cy="370" r="4" fill="#059669"/>

  <!-- Bottom Lines -->
  <path d="M330 350 V430 L290 470 H180 L140 510 H40" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
