  <circle cx="140" cy="510" r="5" fill="#38bdf8"/>
  <circle cx="40" cy="510" r="4" fill="#2563eb"/>

  <path d="M300 350 V450 L350 500 H480 L520 540 H570" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="350" cy="500" r="4" fill="#a78bfa"/>
  <circle cx="480" cy="500" r="4" fill="#c084fc"/>

