<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="circuitGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="circuitGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brainNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Central Microprocessor Unit -->
  <rect x="250" y="250" width="100" height="100" rx="16" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.6"/>
  <rect x="270" y="270" width="60" height="60" rx="8" stroke="#8b5cf6" stroke-width="2.5" fill="none" opacity="0.8"/>
  <circle cx="300" cy="300" r="16" fill="url(#circuitGlow1)"/>
  <circle cx="300" cy="300" r="6" fill="#38bdf8"/>

  <!-- Core Circuit Bus Lines -->
  <!-- Top Lines -->
  <path d="M270 250 V180 L230 140 H120 L80 100 H20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="230" cy="140" r="4" fill="#60a5fa"/>
  <circle cx="80" cy="100" r="5" fill="#38bdf8"/>
  <circle cx="20" cy="100" r="4" fill="#93c5fd"/>

  <path d="M300 250 V150 L340 110 H440 L480 70 H560" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
