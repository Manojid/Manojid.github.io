  <circle cx="480" cy="70" r="5" fill="#c084fc"/>
  <circle cx="560" cy="70" r="4" fill="#818cf8"/>

  <path d="M330 250 V190 L380 140 H500" stroke="#0ea5e9" stroke-width="1.75" stroke-linecap="round" opacity="0.7"/>
  <circle cx="380" cy="140" r="4" fill="#38bdf8"/>
  <circle cx="500" cy="140" r="4" fill="#0284c7"/>

